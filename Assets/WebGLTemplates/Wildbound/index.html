<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puma: Wildbound</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b1527;color:#fff0d1;font:16px system-ui,sans-serif}
    body{display:grid;place-items:center}main{width:min(100vw,calc(100dvh * 16/9));position:relative;aspect-ratio:16/9}
    canvas{width:100%;height:100%;display:block;background:#0b1527;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;gap:20px;text-align:center;background:#0b1527;padding:30px}
    h1{font-size:clamp(26px,5vw,60px);letter-spacing:.08em;margin:0}p{max-width:560px;line-height:1.6;margin:auto}
    progress{width:100%;accent-color:#edb878}button{font:inherit;background:#254950;color:#fff0d1;border:1px solid #8aa88a;border-radius:5px;padding:8px 14px;cursor:pointer}
    #fullscreen{position:absolute;right:16px;bottom:12px;opacity:.6}#fullscreen:hover,#fullscreen:focus{opacity:1}
    #start{padding:14px 20px}#hint{font-size:13px;color:#a7c3b7}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main id="player">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Puma Wildbound platform adventure. Keyboard or gamepad required."></canvas>
    <section id="loading" aria-live="polite">
      <h1>WILDBOUND</h1><p>Quiet paws. A wild heart after dark.</p>
      <p id="hint">Keyboard or gamepad required. A / D move · SPACE jump · SHIFT pounce · J claw · K dash-claw · L roll · Q stalk. Press C in-game for the field guide.</p>
      <button id="start" type="button">Enter the wild</button>
      <progress id="progress" max="1" value="0" aria-label="Loading game" hidden></progress>
      <p id="status"></p>
    </section>
    <button id="fullscreen" type="button" hidden>Fullscreen</button>
  </main>
  <script>
    const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
    const start=document.getElementById('start'),progress=document.getElementById('progress'),status=document.getElementById('status');
    const fullscreen=document.getElementById('fullscreen');let instance;
    function failure(message){status.textContent='The trail could not load. '+message;start.hidden=false;start.disabled=false;start.textContent='Try again';progress.hidden=true;}
    start.addEventListener('click',()=>{
      start.disabled=true;start.hidden=true;progress.hidden=false;status.textContent='Finding a way through the canopy…';
      const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
      script.onerror=()=>{script.remove();failure('Check your connection and retry.');};
      script.onload=()=>createUnityInstance(canvas,{
        dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
        streamingAssetsUrl:'StreamingAssets',companyName:'Sid Hulyalkar',productName:'Puma: Wildbound',productVersion:'0.2.0',
        devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
      },value=>{progress.value=value;}).then(game=>{instance=game;loading.hidden=true;fullscreen.hidden=false;canvas.focus();}).catch(()=>failure('WebGL 2 and a supported desktop browser are required.'));
      document.body.appendChild(script);
    });
    fullscreen.addEventListener('click',()=>{if(instance)instance.SetFullscreen(1);});
    canvas.addEventListener('pointerdown',()=>canvas.focus());
    canvas.addEventListener('keydown',event=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(event.code))event.preventDefault();});
  </script>
</body>
</html>
